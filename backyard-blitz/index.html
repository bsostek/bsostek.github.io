<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Backyard Blitz: a 4-on-4 backyard football game in 3D. Call or draw plays, then pull back to aim and throw.">
<style>body{margin:0;font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}</style>
</head>
<body>
<title>Backyard Blitz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed 3D backyard; a lightbulb scoreboard pinned top, play sheets rise from the bottom. Single dark "night board" look by design. */
:root {
  --board: #13202c;
  --board-hi: #1d3041;
  --line: #2d4559;
  --chalk: #f4f1e6;
  --muted: #9db0bd;
  --blue: #3474e6;
  --red: #e2483c;
  --bulb: #ffcf3a;
  --bulb-deep: #b38a12;
  --ink: #0a1016;
  --scrim: rgba(10, 16, 22, .9);
  --f-display: "Bungee", Impact, "Arial Black", sans-serif;
  --f-ui: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--ink); color: var(--chalk); font-family: var(--f-ui); font-size: 16px; overflow: hidden; -webkit-user-select: none; user-select: none; }
#app { position: fixed; inset: 0; overflow: hidden; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Scoreboard */
#hud { position: absolute; top: 0; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: calc(env(safe-area-inset-top, 0px) + 10px); pointer-events: none; z-index: 5; }
.board { display: grid; grid-template-columns: 1fr auto 1fr; background: var(--board); border: 2px solid var(--line); border-radius: 6px; box-shadow: 0 6px 22px rgba(0,0,0,.35); overflow: hidden; width: min(440px, 100%); }
.team { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 10px; }
.team.blue { background: var(--blue); }
.team.red { background: var(--red); flex-direction: row-reverse; }
.tname { font-family: var(--f-display); font-size: 15px; letter-spacing: .05em; }
.pts { font-family: var(--f-display); font-size: 26px; line-height: 1.1; color: var(--bulb); min-width: 2.2ch; text-align: center; font-variant-numeric: tabular-nums; background: var(--ink); padding: 0 6px; border-radius: 3px; text-shadow: 0 0 10px rgba(255,207,58,.55); }
.clock { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3px 14px; background: var(--board-hi); min-width: 84px; }
#qtr { font-size: 12px; letter-spacing: .16em; color: var(--muted); font-weight: 700; }
#clk { font-family: var(--f-display); font-size: 20px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.strip { background: var(--scrim); border: 1px solid var(--line); border-radius: 4px; padding: 3px 12px; font-weight: 700; letter-spacing: .08em; font-size: 15px; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.strip b { color: var(--bulb); font-weight: 700; }

/* Banners and live readouts */
#banner { position: absolute; left: 0; right: 0; top: 30%; text-align: center; pointer-events: none; opacity: 0; transform: scale(.92); transition: opacity .18s, transform .25s; z-index: 4; }
#banner.on { opacity: 1; transform: none; }
#banner .big { font-family: var(--f-display); font-size: clamp(34px, 7.5vw, 76px); line-height: 1; color: var(--chalk); text-shadow: 0 4px 0 var(--ink), 0 0 34px rgba(0,0,0,.45); text-wrap: balance; padding: 0 16px; }
#banner .small { margin-top: 8px; font-weight: 700; font-size: clamp(18px, 3vw, 26px); letter-spacing: .12em; text-transform: uppercase; text-shadow: 0 2px 0 var(--ink); }
#banner.gold .big { color: var(--bulb); }
#banner.bad .big { color: var(--red); }
#count { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 104px); text-align: center; font-family: var(--f-display); font-size: clamp(16px, 3vw, 24px); letter-spacing: .04em; pointer-events: none; text-shadow: 0 3px 0 var(--ink); z-index: 4; }
#count.rush { color: var(--red); }
#aimLabel { position: absolute; transform: translate(-50%, -170%); font-family: var(--f-display); font-size: 14px; color: var(--ink); background: var(--bulb); padding: 2px 8px; border-radius: 3px; pointer-events: none; white-space: nowrap; z-index: 4; }
#hint { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); text-align: center; font-weight: 600; font-size: 15px; letter-spacing: .05em; color: var(--chalk); text-shadow: 0 1px 3px var(--ink); pointer-events: none; z-index: 3; }
#hint kbd, .controls kbd { font-family: var(--f-ui); font-weight: 700; font-size: .9em; background: var(--board-hi); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 5px; }
#juke { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 56px); width: 84px; height: 84px; border-radius: 50%; border: 3px solid var(--ink); background: var(--bulb); color: var(--ink); font-family: var(--f-display); font-size: 17px; box-shadow: 0 5px 0 var(--bulb-deep); cursor: pointer; z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
#juke small { font-family: var(--f-ui); font-weight: 700; font-size: 12px; letter-spacing: .1em; }
#juke.cool { opacity: .45; }

/* Buttons */
.btn { font-family: var(--f-ui); font-weight: 700; letter-spacing: .07em; text-transform: uppercase; font-size: 16px; padding: 10px 16px; border-radius: 6px; border: 2px solid var(--line); background: var(--board); color: var(--chalk); cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--bulb); color: var(--ink); border-color: var(--bulb); box-shadow: 0 4px 0 var(--bulb-deep); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.hike { font-family: var(--f-display); font-size: 30px; padding: 10px 40px; background: var(--bulb); color: var(--ink); border-color: var(--ink); box-shadow: 0 6px 0 var(--bulb-deep); }
.btn:active { transform: translateY(2px); }
button:focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; }

/* Play-call sheet */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 58%; overflow-y: auto; background: linear-gradient(to top, var(--ink) 0%, var(--scrim) 78%, rgba(10,16,22,0) 100%); padding-block: 44px calc(env(safe-area-inset-bottom, 0px) + 14px); z-index: 6; }
.sheet-in { max-width: 1060px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.sheet-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sheet-head h2 { margin: 0; font-family: var(--f-display); font-size: 24px; font-weight: 400; letter-spacing: .02em; }
.situ { font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.card-wrap { position: relative; min-width: 0; }
.card { width: 100%; display: flex; flex-direction: column; gap: 4px; text-align: left; background: var(--board); border: 2px solid var(--line); border-radius: 8px; padding: 7px; color: var(--chalk); cursor: pointer; font-family: var(--f-ui); transition: border-color .12s, transform .12s; }
.card:hover { border-color: var(--bulb); transform: translateY(-2px); }
.card canvas { width: 100%; aspect-ratio: 3 / 2; border-radius: 4px; display: block; }
.card b { font-size: 18px; letter-spacing: .03em; font-weight: 700; line-height: 1.1; }
.card span { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.card.draw { border-style: dashed; border-color: var(--bulb); }
.card.draw .sketch { aspect-ratio: 3 / 2; border-radius: 4px; display: grid; place-items: center; background: repeating-linear-gradient(0deg, #2f6e27 0 14px, #34762b 14px 28px); }
.card-del { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: var(--ink); color: var(--chalk); cursor: pointer; font-size: 15px; line-height: 1; }
@media (max-width: 560px) {
  .cards { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; }
  .card-wrap { flex: 0 0 138px; scroll-snap-align: start; }
}

/* Route drawing */
.draw-tip { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 104px); text-align: center; margin: 0; font-weight: 700; letter-spacing: .05em; font-size: 16px; text-shadow: 0 1px 3px var(--ink); pointer-events: none; z-index: 5; }
.drawbar { position: absolute; left: 0; right: 0; bottom: 0; padding-block: 28px calc(env(safe-area-inset-bottom, 0px) + 14px); background: linear-gradient(to top, var(--scrim), rgba(10,16,22,0)); display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 6; }
.chips, .draw-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.chip { font-family: var(--f-ui); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; padding: 6px 12px; border-radius: 99px; border: 2px solid var(--line); background: var(--board); color: var(--chalk); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--bulb); color: var(--bulb); }
.snapbar { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 44px); display: flex; justify-content: center; align-items: center; gap: 14px; flex-wrap: wrap; z-index: 6; }

/* Modals */
#modal { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(5, 9, 13, .6); z-index: 10; padding-block: 16px; }
.mcard { width: min(540px, 100%); max-height: 88vh; overflow-y: auto; background: var(--board); border: 2px solid var(--line); border-radius: 10px; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.5); display: flex; flex-direction: column; gap: 12px; }
.mcard h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(34px, 8vw, 50px); line-height: .95; color: var(--bulb); text-shadow: 0 4px 0 var(--ink); text-wrap: balance; }
.mcard h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 28px; line-height: 1.05; text-wrap: balance; }
.mcard p { margin: 0; font-size: 18px; line-height: 1.35; color: var(--chalk); max-width: 60ch; }
.eyebrow { font-weight: 700; letter-spacing: .18em; text-transform: uppercase; font-size: 13px; color: var(--muted); }
.eyebrow.red { color: var(--red); }
.eyebrow.blue { color: var(--blue); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.controls { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0; font-size: 17px; line-height: 1.3; }
.controls dt { font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 14px; color: var(--bulb); padding-top: 2px; }
.controls dd { margin: 0; color: var(--chalk); }
.drive { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.drive li { display: grid; grid-template-columns: 74px 1fr; gap: 10px; font-size: 17px; line-height: 1.3; animation: rise .35s both; animation-delay: calc(var(--i) * .22s); }
.drive li .at { font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-top: 3px; font-variant-numeric: tabular-nums; }
.drive li.td { color: var(--red); font-weight: 700; }
.drive li.stop { color: var(--bulb); font-weight: 700; }
.final { display: flex; justify-content: center; gap: 16px; align-items: center; font-family: var(--f-display); font-size: 40px; }
.final .b { color: var(--blue); }
.final .r { color: var(--red); }
.final .dash { color: var(--muted); font-size: 24px; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .drive li { animation: none; } #banner { transition: none; } .card { transition: none; } }

#toast { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); transform: translateX(-50%); background: var(--chalk); color: var(--ink); font-weight: 700; letter-spacing: .06em; padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 12; white-space: nowrap; }
#toast.on { opacity: 1; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-size: 22px; color: var(--muted); z-index: 20; background: var(--ink); }
</style>

<div id="app">
  <canvas id="c"></canvas>

  <div id="hud" class="gutter">
    <div class="board" aria-label="Scoreboard">
      <div class="team blue"><span class="tname">Blue</span><span class="pts" id="sBlue">0</span></div>
      <div class="clock"><span id="qtr">Q1</span><span id="clk">4:00</span></div>
      <div class="team red"><span class="tname">Red</span><span class="pts" id="sRed">0</span></div>
    </div>
    <div class="strip" id="downs">1st &amp; 10 · Own 10</div>
  </div>

  <div id="banner" aria-live="polite"><div class="big"></div><div class="small"></div></div>
  <div id="count"></div>
  <div id="aimLabel" hidden></div>
  <div id="hint" class="gutter"></div>
  <button id="juke" hidden>JUKE<small>SPACE</small></button>

  <section id="playcall" class="sheet" hidden>
    <div class="sheet-in gutter">
      <header class="sheet-head"><h2>Call a play</h2><span class="situ" id="pcSitu"></span></header>
      <div class="cards" id="cards"></div>
    </div>
  </section>

  <div id="drawbar" hidden>
    <p class="draw-tip gutter">Drag from a receiver to draw a route. Receivers stop where the line ends.</p>
    <div class="drawbar gutter">
      <div class="chips" id="formChips"></div>
      <div class="draw-actions">
        <button class="btn" id="dBack">Back</button>
        <button class="btn" id="dClear">Clear</button>
        <button class="btn" id="dSave">Save to playbook</button>
        <button class="btn primary" id="dRun">Run it</button>
      </div>
    </div>
  </div>

  <div id="snapbar" class="snapbar gutter" hidden>
    <button class="btn" id="btnChange">Change play</button>
    <button class="btn hike" id="btnHike">HIKE</button>
  </div>

  <div id="modal" class="gutter" hidden><div class="mcard" id="mcard" role="dialog" aria-modal="true"></div></div>
  <div id="toast"></div>
  <div id="loading">Raking the yard…</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ---------- helpers
const $ = (id) => document.getElementById(id);
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const hyp = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
const angLerp = (a, b, t) => a + ((((b - a) % (Math.PI * 2)) + Math.PI * 3) % (Math.PI * 2) - Math.PI) * t;
const ord = (n) => ['1st', '2nd', '3rd', '4th'][n - 1] || `${n}th`;
const isTouch = matchMedia('(pointer: coarse)').matches;

// ---------- field constants (1 unit = 1 yard)
// World: x is lateral (screen-left is +x from the offense's view), z runs downfield. Blue attacks +z.
// Playable field z 0..60, Blue's end zone -10..0, Red's end zone 60..70, sidelines at x = ±16.
const HALF_W = 16, FIELD_LEN = 60, EZ = 10, QUARTER_LEN = 240, COUNT_SECS = 3;
const ROUTE_COLORS = ['#ffcf3a', '#3fe0cf', '#ff7ad1'];
const SPEED = { wr: 7.2, qb: 5.8, scramble: 6.3, rush: 6.6 };

// Play space (used by the playbook and route drawing): x = screen right, y = yards past the line of scrimmage.
const ps2w = (x, y, los) => V(-x, 0, los + y);

// ---------- playbook
const PLAYBOOK = [
  { name: 'Slants', tag: 'Quick', recv: [
    { start: [-12, 0], path: [[-12, 3], [-5, 9]], end: 'go' },
    { start: [5, 0], path: [[5, 14]], end: 'go' },
    { start: [12, 0], path: [[12, 3], [5, 9]], end: 'go' } ] },
  { name: 'Curl Flat', tag: 'Short', recv: [
    { start: [-12, 0], path: [[-12, 10], [-11, 8]], end: 'settle' },
    { start: [-5, 0], path: [[-6, 2], [-14, 3]], end: 'settle' },
    { start: [12, 0], path: [[12, 10], [2, 11]], end: 'go' } ] },
  { name: 'Mesh', tag: 'Crossers', recv: [
    { start: [-12, 0], path: [[-11, 3], [10, 4]], end: 'go' },
    { start: [12, 0], path: [[11, 2], [-10, 3]], end: 'go' },
    { start: [5, 0], path: [[5, 10], [13, 18]], end: 'go' } ] },
  { name: 'Comebacks', tag: 'Intermediate', recv: [
    { start: [-12, 0], path: [[-12, 14], [-14, 11]], end: 'settle' },
    { start: [-4, 0], path: [[-4, 3], [12, 5]], end: 'go' },
    { start: [12, 0], path: [[12, 14], [14, 11]], end: 'settle' } ] },
  { name: 'Post Corner', tag: 'Deep', recv: [
    { start: [-12, 0], path: [[-12, 12], [-4, 22]], end: 'go' },
    { start: [5, 0], path: [[5, 6], [13, 6]], end: 'settle' },
    { start: [12, 0], path: [[12, 10], [15, 17]], end: 'go' } ] },
  { name: 'Verticals', tag: 'Deep', recv: [
    { start: [-12, 0], path: [[-12, 8]], end: 'go' },
    { start: [-5, 0], path: [[-4, 8]], end: 'go' },
    { start: [12, 0], path: [[12, 8]], end: 'go' } ] },
  { name: 'Bomb', tag: 'Shot play', recv: [
    { start: [-12, 0], path: [[-12, 8], [-3, 20]], end: 'go' },
    { start: [12, 0], path: [[12, 6]], end: 'go' },
    { start: [3, -3], path: [[9, -2], [14, 2]], end: 'go' } ] },
];
const FORMATIONS = {
  spread: { label: 'Spread', starts: [[-12, 0], [-5, 0], [12, 0]] },
  trips: { label: 'Trips', starts: [[5, 0], [9, 0], [13, 0]] },
  bunch: { label: 'Bunch', starts: [[-9, 0], [-7, -1.3], [-11, -1.3]] },
  back: { label: 'Backfield', starts: [[-12, 0], [12, 0], [3, -3]] },
};

const STORE_KEY = 'backyard-blitz-plays';
function loadCustom() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch { return []; } }
function saveCustom() { try { localStorage.setItem(STORE_KEY, JSON.stringify(customPlays)); } catch { /* storage unavailable */ } }
let customPlays = loadCustom();

// ---------- renderer / scene
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfe8f2, 90, 190);
const camera = new THREE.PerspectiveCamera(50, 1, 0.5, 500);
camera.position.set(0, 14, -8);

function skyTexture() {
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#5aa8e0'); gr.addColorStop(0.6, '#a9d7ef'); gr.addColorStop(1, '#e4f3f6');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
scene.background = skyTexture();
scene.add(new THREE.HemisphereLight(0xe4f4ff, 0x4f7c2e, 1.0));
const sun = new THREE.DirectionalLight(0xfff0d2, 1.9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -38, right: 38, top: 38, bottom: -38, near: 1, far: 160 });
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);

function fieldTexture() {
  const S = 16, W = HALF_W * 2 * S, H = (FIELD_LEN + EZ * 2) * S;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const cy = (z) => (FIELD_LEN + EZ - z) * S; // z=70 at the top of the canvas
  const cx = (x) => (HALF_W - x) * S;         // x=+16 at the left of the canvas
  for (let z = 0; z < FIELD_LEN; z += 5) { g.fillStyle = (z / 5) % 2 ? '#4c9638' : '#55a240'; g.fillRect(0, cy(z + 5), W, 5 * S); }
  g.fillStyle = '#2a5bb8'; g.fillRect(0, cy(0), W, EZ * S);
  g.fillStyle = '#b8352b'; g.fillRect(0, cy(FIELD_LEN + EZ), W, EZ * S);
  // mowing wear
  for (let i = 0; i < 1800; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? '255,255,220' : '20,50,10'},${rand(.03, .08)})`; g.fillRect(rand(0, W), rand(cy(FIELD_LEN), cy(0)), rand(2, 6), rand(2, 6)); }
  g.fillStyle = 'rgba(255,255,255,.92)';
  for (let z = 0; z <= FIELD_LEN; z += 5) g.fillRect(0, cy(z) - (z % 10 === 0 ? 2.5 : 1.5), W, z % 10 === 0 ? 5 : 3);
  for (let z = 1; z < FIELD_LEN; z++) { if (z % 5 === 0) continue; for (const x of [-15.2, -3, 3, 15.2]) g.fillRect(cx(x) - 5, cy(z) - 1, 10, 2); }

}

}

// ---------- movement
function steer(e, tx, tz, sp, dt, arrive = true) {
  const dx = tx - e.pos.x, dz = tz - e.pos.z, d = Math.hypot(dx, dz);
  let s = sp; if (arrive && d < 1.5) s = sp * d / 1.5;
  steerVel(e, d > 1e-4 ? dx / d * s : 0, d > 1e-4 ? dz / d * s : 0, e.agility, dt);
}
function steerVel(e, vx, vz, agility, dt) {

}

function keepIn(e, carrier = false) {

  e.pos.z = clamp(e.pos.z, -EZ - 2, FIELD_LEN + EZ - 0.4);
}

const keys = new Set();
function moveInput() {
  const k = (...a) => a.some((x) => keys.has(x));
  let x = (k('a', 'arrowleft') ? 1 : 0) - (k('d', 'arrowright') ? 1 : 0); // screen-left is +x
  let z = (k('w', 'arrowup') ? 1 : 0) - (k('s', 'arrowdown') ? 1 : 0);
  const L = Math.hypot(x, z); if (L > 0) { x /= L; z /= L; }
  return { x, z };
}
const touchSteer = { id: null, x: 0 };

// ---------- live play
function hike() {
  if (G.phase !== 'presnap') return;
  G.phase = 'live';
  $('snapbar').hidden = true;
  setRouteOpacity(0.28);
  setHint(isTouch ? 'Pull back anywhere to aim · release to throw' : 'Click and pull back to aim · release to throw · <kbd>WASD</kbd> moves the QB');
}

function updateLive(dt) {
  P.t += dt;
  if (!P.rushing) {
    const n = Math.floor(P.t) + 1;
    if (P.t >= COUNT_SECS) { P.rushing = true; setCount('Rush!', true); }
    else if (n !== P.countShown) { P.countShown = n; setCount(`${['One', 'Two', 'Three'][n - 1]} Mississippi`); }
  } else if (P.t > COUNT_SECS + 1.2) setCount('');
  P.jukeCd = Math.max(0, P.jukeCd - dt);

  if (P.ball === 'qb') {
    const inp = moveInput();
    steerVel(qb, inp.x * SPEED.qb, inp.z * SPEED.qb, 10, dt);
    integrate(qb, dt); keepIn(qb);
    if (qb.pos.z > G.los + 0.25) {
      cancelAim(); P.ball = 'carried'; P.carrier = qb; showRunUI();
      flashNote('Scramble!');
    }
  } else if (P.ball === 'carried') controlCarrier(dt);
  else { steerVel(qb, 0, 0, 5, dt); integrate(qb, dt); }

  P.blockTaken.clear();
  receivers.forEach((r) => { if (r !== P.carrier) updateReceiver(r, dt); });
  defense.forEach((d) => updateDefender(d, dt));
  updateBall(dt);
  if (G.phase === 'live') checkContacts();
}

function controlCarrier(dt) {
  const c = P.carrier, inp = moveInput();
  let dx = inp.x, dz = inp.z;
  if (touchSteer.id !== null) { const t = Math.abs(touchSteer.x) < 0.12 ? 0 : touchSteer.x; dx = -t * 1.4; dz = 1; }
  if (!dx && !dz) dz = 1;
  const L = Math.hypot(dx, dz); dx /= L; dz /= L;
  const sp = (c === qb ? SPEED.scramble : SPEED.wr) * (c.slow > 0 ? 0.55 : 1);
  steerVel(c, dx * sp, dz * sp, 9, dt);
  if (P.juke > 0) { P.juke -= dt; c.vel.x = P.jukeDir * 8.5; }
  integrate(c, dt); keepIn(c, true);
  c.slow = Math.max(0, c.slow - dt);
}

function juke() {
  if (!P || G.phase !== 'live' || P.ball !== 'carried' || P.jukeCd > 0) return;
  const c = P.carrier, inp = moveInput();
  let dir = inp.x ? Math.sign(inp.x) : touchSteer.id !== null && Math.abs(touchSteer.x) > 0.12 ? -Math.sign(touchSteer.x) : 0;
  if (!dir) {
    let near = null, nd = 1e9; defense.forEach((d) => { const k = hyp(d.pos, c.pos); if (k < nd) { nd = k; near = d; } });
    dir = near && near.pos.x > c.pos.x ? -1 : 1;
  }
  P.juke = 0.24; P.jukeDir = dir; P.jukeCd = 2.2;
  defense.forEach((d) => { if (hyp(d.pos, c.pos) < 3.4 && Math.random() < 0.8) d.stun = 0.6; });
  $('juke').classList.add('cool');
  setTimeout(() => $('juke').classList.remove('cool'), 2200);
}

function updateReceiver(r, dt) {
  if (G.phase !== 'live') { steerVel(r, 0, 0, 4, dt); integrate(r, dt); return; }
  if (P.ball === 'air' && r === P.intended && P.flight) {
    steer(r, P.flight.e.x, P.flight.e.z, r.speed, dt, true); integrate(r, dt); keepIn(r); return;
  }
  if (P.ball === 'carried') { blockFor(r, dt); integrate(r, dt); keepIn(r); return; }
  const ramp = Math.min(1, 0.55 + P.t * 0.9);
  if (r.ri < r.route.length) {
    const p = r.route[r.ri];
    if (hyp(r.pos, p) < 0.7) r.ri++;
    steer(r, p.x, p.z, r.speed * ramp, dt, false);
  } else if (r.settle) {
    const p = r.route[r.route.length - 1] || r.pos;
    steer(r, p.x, p.z, r.speed, dt, true);
    if (Math.hypot(r.vel.x, r.vel.z) < 1) r.faceTo = Math.atan2(qb.pos.x - r.pos.x, qb.pos.z - r.pos.z);
  } else {
    steer(r, r.pos.x + r.dir.x * 5, r.pos.z + r.dir.z * 5, r.speed * ramp, dt, false);
  }

}

function blockFor(r, dt) {
  r.faceTo = null;
  const c = P.carrier; let best = null, bd = 1e9;
  defense.forEach((d) => {
    if (d.blockBudget <= 0 || d.stun > 0 || P.blockTaken.has(d)) return;
    const k = hyp(d.pos, c.pos) + hyp(d.pos, r.pos) * 0.6; if (k < bd) { bd = k; best = d; }
  });
  if (!best || hyp(best.pos, c.pos) > 14) { steer(r, c.pos.x + (r.pos.x > c.pos.x ? 3 : -3), c.pos.z + 5, r.speed * 0.8, dt, true); return; }
  P.blockTaken.add(best);
  const tx = best.pos.x + (c.pos.x - best.pos.x) * 0.15, tz = best.pos.z + (c.pos.z - best.pos.z) * 0.15;
  steer(r, tx, tz, r.speed * 0.95, dt, false);
  if (hyp(r.pos, best.pos) < 1.15) { best.blocked = 0.15; best.blockBudget -= dt; }
}

function updateDefender(d, dt) {
  if (G.phase !== 'live') { steerVel(d, 0, 0, 4, dt); integrate(d, dt); return; }
  if (d.stun > 0) { d.stun -= dt; steerVel(d, 0, 0, 5, dt); integrate(d, dt); return; }
  const sp = d.speed * (d.blocked > 0 ? 0.3 : 1);
  d.blocked = Math.max(0, d.blocked - dt);
  if (P.ball === 'carried') pursue(d, P.carrier, sp, dt);
  else if (d === rusher) {
    if (!P.rushing) steer(d, d.home.x, d.home.z, 3, dt, true);
    else if (P.ball === 'qb') pursue(d, qb, sp, dt);
    else if (P.ball === 'air' && d.react != null && P.t >= d.react && P.flight) steer(d, P.flight.e.x, P.flight.e.z, sp, dt, true);
    else steerVel(d, 0, 0, 3, dt);
  } else if (P.ball === 'air' && d.react != null && P.t >= d.react && P.flight) {
    steer(d, P.flight.e.x, P.flight.e.z, sp, dt, true);
  } else if (d.man) {
    const r = d.man, cushion = Math.max(0.6, 4 - P.t * 1.4);
    steer(d, r.pos.x + r.vel.x * 0.3 + (r.pos.x > 0 ? -0.6 : 0.6), r.pos.z + r.vel.z * 0.3 + cushion, sp, dt, true);
  } else zoneCover(d, sp, dt);

}

function zoneCover(d, sp, dt) {
  const a = d.anchor; let best = null, score = -1e9;
  receivers.forEach((r) => {
    const k = hyp(r.pos, a); if (k > 13) return;
    const s = d.zone === 'deep' ? r.pos.z - k * 0.3 : -k;
    if (s > score) { score = s; best = r; }
  });
  if (!best) { steer(d, a.x, a.z + P.t * 0.6, sp * 0.7, dt, true); return; }
  if (d.zone === 'deep') steer(d, a.x + (best.pos.x - a.x) * 0.75, Math.max(a.z, best.pos.z + 2.5), sp, dt, true);
  else if (best.pos.z < G.los + 13) steer(d, best.pos.x + best.vel.x * 0.3, best.pos.z + best.vel.z * 0.3 + 1.2, sp, dt, true);
  else steer(d, a.x, a.z, sp * 0.7, dt, true);
}

function pursue(d, c, sp, dt) {
  const lead = clamp(hyp(d.pos, c.pos) / sp, 0, 1.2) * 0.7;
  steer(d, c.pos.x + c.vel.x * lead, c.pos.z + c.vel.z * lead, sp, dt, false);

// ---------- throwing
const aim = { on: false, id: null, sx: 0, sy: 0, target: null };
function handPos(e) { return V(e.pos.x, 2.0, e.pos.z + 0.1); }
function aimTarget(dxPx, dyPx) {
  const base = Math.min(innerWidth, innerHeight), ypp = 50 / (base * 0.6);
  let tx = dxPx * ypp, tz = dyPx * ypp; // pull back: drag right sends it screen-left (+x), drag down sends it downfield
  const L = Math.hypot(tx, tz); if (L > 50) { tx *= 50 / L; tz *= 50 / L; }
  tz = Math.max(tz, -10);
  return V(clamp(qb.pos.x + tx, -HALF_W - 5, HALF_W + 5), 0, Math.min(qb.pos.z + tz, FIELD_LEN + EZ + 4));
}
function flightFor(s, e, d) { return { s, e, T: 0.35 + d / 24, h: 0.6 + d * 0.15, t: 0, spin: 0, thrown: true }; }
function flightPos(f, u, out) { out.lerpVectors(f.s, f.e, u); out.y += f.h * 4 * u * (1 - u); return out; }
const tmpV = V(), dummy = new THREE.Object3D();
function drawAim() {
  const t = aim.target; if (!t) return;
  const s = handPos(qb), e = V(t.x, 1.15, t.z), d = hyp(qb.pos, t);
  const f = flightFor(s, e, d);
  for (let i = 0; i < AIM_DOTS; i++) { flightPos(f, i / (AIM_DOTS - 1), dummy.position); dummy.updateMatrix(); aimDots.setMatrixAt(i, dummy.matrix); }
  aimDots.instanceMatrix.needsUpdate = true; aimDots.visible = true;
  reticle.position.set(t.x, 0.06, t.z); reticle.visible = true;
  qb.faceTo = Math.atan2(t.x - qb.pos.x, t.z - qb.pos.z); qb.armOverride = 2.6;
  const v = reticle.position.clone().project(camera);
  const lab = $('aimLabel'); lab.hidden = false; lab.textContent = `${Math.round(d)} yds`;
  lab.style.left = `${(v.x + 1) / 2 * innerWidth}px`; lab.style.top = `${(1 - v.y) / 2 * innerHeight}px`;
}
function cancelAim() {
  aim.on = false; aim.id = null; aim.target = null;
  aimDots.visible = false; reticle.visible = false; $('aimLabel').hidden = true;
  qb.faceTo = null; qb.armOverride = null;
}
function throwBall(target) {
  const d = hyp(qb.pos, target);
  let sc = 0.25 + d * 0.022;
  const near = hyp(rusher.pos, qb.pos);
  if (P.rushing && near < 3) sc += 1.4 * (1 - near / 3) + 0.4;
  if (Math.hypot(qb.vel.x, qb.vel.z) > 2) sc += 0.5;
  const ang = rand(0, Math.PI * 2), rr = Math.sqrt(Math.random()) * sc;
  const e = V(target.x + Math.cos(ang) * rr, 1.15, target.z + Math.sin(ang) * rr);
  P.flight = flightFor(handPos(qb), e, d);
  P.holder = null; P.ball = 'air'; P.throwAnim = 0.28;
  let best = null, bd = 1e9; receivers.forEach((r) => { const k = hyp(r.pos, e); if (k < bd) { bd = k; best = r; } });
  P.intended = best; best.faceTo = null;
  defense.forEach((df) => { df.react = hyp(df.pos, e) < 12 ? P.t + rand(0.15, 0.45) : null; });
  setHint('');
}
function dropFlight(pos) {
  return { s: pos.clone(), e: V(pos.x + rand(-2, 2), 0.15, pos.z + rand(0.5, 2.5)), T: 0.45, h: 0.5, t: 0, spin: 0, thrown: false };
}

function updateBall(dt) {
  const f = P.flight;
  if (f) {
    f.t += dt; const u = Math.min(1, f.t / f.T);
    const pos = flightPos(f, u, ball.position);
    const dv = V(f.e.x - f.s.x, (f.e.y - f.s.y) + f.h * 4 * (1 - 2 * u), f.e.z - f.s.z);
    ball.lookAt(pos.clone().add(dv)); f.spin += dt * 22; ball.rotateZ(f.spin);
    if (f.thrown && G.phase === 'live') { tryCatch(pos, u); if (P.flight !== f) return; }
    if (u >= 1) {
      if (f.thrown) { P.flight = dropFlight(pos.clone()); if (G.phase === 'live') endPlay('inc', G.los, 'Incomplete'); }
      else { P.flight = null; ball.position.y = 0.15; ball.rotation.set(0, rand(0, 6), Math.PI / 2); }
    }
    return;
  }
}

// A held ball rides in the holder's own body space (tucked under the right arm, or cocked behind the head),
// so it tilts and falls with the player instead of poking through him.
const BALL_TUCK = V(-0.43, 1.35, 0.1), BALL_COCKED = V(-0.42, 2.25, -0.3);
const ballTilt = new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.35, 0, 0));
function placeHeldBall() {
  if (!P || P.flight || !P.holder) return;
  const g = P.holder.mesh.group; g.updateMatrixWorld();
  ball.position.copy(P.holder === qb && aim.on ? BALL_COCKED : BALL_TUCK).applyMatrix4(g.matrixWorld);
  ball.quaternion.copy(g.quaternion).multiply(ballTilt);
}

function tryCatch(pos, u) {
  if (u < 0.4 || pos.y > 2.9) return;
  let br = null, brd = 9, bd = null, bdd = 9;
  receivers.forEach((r) => { const k = hyp(r.pos, pos); if (k < brd) { brd = k; br = r; } });
  defense.forEach((d) => { if (d.stun > 0) return; const k = hyp(d.pos, pos); if (k < bdd) { bdd = k; bd = d; } });
  const R = 1.45;
  if (brd >= R && bdd >= R) return;
  if (bdd < R && (brd >= R || bdd < brd - 0.2)) {
    if (Math.random() < 0.38) {
      P.flight = null; P.holder = bd;
      return endPlay('int', bd.pos.z, 'Intercepted!', 'Red ball');
    }
    P.flight = dropFlight(pos.clone());
    return endPlay('inc', G.los, 'Broken up');
  }
  const contested = defense.some((d) => d.stun <= 0 && hyp(d.pos, br.pos) < 1.8);
  let p = contested ? 0.6 : 0.95; if (brd > 1.1) p -= 0.12;
  if (Math.random() < p) {
    if (br.pos.z > FIELD_LEN + EZ) { P.flight = dropFlight(pos.clone()); return endPlay('inc', G.los, 'Out the back'); }
    P.flight = null; P.holder = br; P.carrier = br; P.ball = 'carried'; br.faceTo = null;
    if (br.pos.z >= FIELD_LEN) return endPlay('td', FIELD_LEN, 'Touchdown!');
    showRunUI();
  } else {
    P.flight = dropFlight(pos.clone());
    endPlay('inc', G.los, contested ? 'Knocked loose' : 'Dropped');
  }
}

function checkContacts() {
  if (P.ball === 'qb') {
    for (const d of defense) if (d.stun <= 0 && hyp(d.pos, qb.pos) < 0.95) {
      qb.falling = true; d.falling = true;
      if (qb.pos.z < 0) return endPlay('safety', qb.pos.z, 'Safety', 'Red +2');
      return endPlay('sack', qb.pos.z, 'Sacked');
    }
  }
  if (P.ball === 'carried') {
    const c = P.carrier;
    if (Math.abs(c.pos.x) > HALF_W) return endPlay('oob', c.pos.z, 'Out of bounds');
    if (c.pos.z >= FIELD_LEN) return endPlay('td', FIELD_LEN, 'Touchdown!');
    for (const d of defense) if (d.stun <= 0 && hyp(d.pos, c.pos) < 0.95) {
      if (!d.triedBreak && Math.random() < 0.14) { d.triedBreak = true; d.stun = 0.9; c.slow = 0.35; flashNote('Broken tackle!'); continue; }
      c.falling = true; d.falling = true;
      if (c.pos.z < 0) return endPlay('safety', c.pos.z, 'Safety', 'Red +2');
      return endPlay('tackle', c.pos.z, 'Tackled');
    }
  }
}

function gainText(g) { const n = Math.round(g); return n > 0 ? `+${n} yds` : n < 0 ? `${n} yds` : 'No gain'; }
function endPlay(type, spot, title, sub = '') {
  if (P.over) return;
  P.over = true; P.result = { type, spot }; P.deadT = 2.0;
  G.phase = 'dead';
  cancelAim(); hideRunUI(); setCount(''); setHint('');
  if (!sub && (type === 'tackle' || type === 'oob' || type === 'sack')) sub = gainText(spot - G.los);
  let tone = '';
  if (G.pat) { if (type === 'td') { title = `${G.pat.pts}-point try is good!`; tone = 'gold'; } else sub = 'Try fails'; }
  else if (type === 'td') tone = 'gold';
  else if (type === 'int' || type === 'safety' || type === 'sack') tone = 'bad';
  banner(title, sub, tone, 2000);
}

function updateDead(dt) {
  P.t += 0; // the clock stops with the whistle
  everyone.forEach((e) => { if (e.stun > 0) e.stun -= dt; steerVel(e, 0, 0, e.falling ? 6 : 2.5, dt); integrate(e, dt); });
  updateBall(dt);
  P.deadT -= dt;
  if (P.deadT <= 0 && !P.resolving) { P.resolving = true; resolvePlay(P.result); }
}

// ---------- game flow
function burn(s) { G.clock = Math.max(0, G.clock - s); updateHUD(); }

async function resolvePlay(r) {
  if (G.pat) {
    const ok = r.type === 'td';
    if (ok) G.score.blue += G.pat.pts;
    G.pat = null; updateHUD();
    await changePossession(50);
    return;
  }
  runClock(P.t, r.type);
  if (r.type === 'td') {
    G.score.blue += 6; updateHUD();
    const pts = await showModal(`<div class="eyebrow blue">Touchdown Blue</div><h2>Go for one or two?</h2><p>One point from the 5-yard line, or two from the 10. Same rules, one play.</p>`,
      [{ label: 'Go for 1 · from the 5', value: 1, primary: true }, { label: 'Go for 2 · from the 10', value: 2 }]);
    G.pat = { pts }; G.los = FIELD_LEN - (pts === 1 ? 5 : 10); G.down = 1; G.fdLine = FIELD_LEN;
    toPlaycall(); return;
  }
  if (r.type === 'safety') { G.score.red += 2; updateHUD(); await changePossession(35, 'Safety. Blue free-kicks it away.'); return; }
  if (r.type === 'int') { await changePossession(r.spot >= FIELD_LEN ? 50 : clamp(r.spot, 1, 59), 'Blue threw an interception.'); return; }
  let note = '';
  if (r.type !== 'inc') G.los = clamp(r.spot, 1, 59);
  if (r.type !== 'inc' && G.los >= G.fdLine - 0.01) { G.down = 1; G.fdLine = Math.min(FIELD_LEN, G.los + 10); note = 'First down'; }
  else if (G.down >= 4) { await changePossession(G.los, 'Blue turns it over on downs.'); return; }
  else G.down++;
  if (await checkQuarter()) return;
  toPlaycall(note);
}

async function changePossession(redDist, lead = '') {
  const halfEnds = G.quarter === 2 || G.quarter === 4;
  if (G.clock <= 0 && halfEnds) { await checkQuarter(); return; }
  const d = simulateRedDrive(redDist);
  if (halfEnds && d.time > G.clock) {
    // Red runs out of time before the half (or game) ends
    let used = 0; const kept = [];
    for (const l of d.log) { if (used + l.secs > G.clock) break; used += l.secs; kept.push(l); }
    kept.push({ at: 'Clock', text: 'Time runs out on Red.', tone: 'stop', secs: 0 });
    Object.assign(d, { log: kept, points: 0, headline: 'Out of time', summary: 'The clock beat Red to the end zone.', time: G.clock });
  }
  G.redBall = true; G.score.red += d.points; updateHUD();
  await showModal(redDriveHTML(d, lead), [{ label: 'Back to offense', value: 1, primary: true }]);
  G.redBall = false;
  // A drive that spills past the end of Q1 or Q3 carries its extra time into the next quarter
  G.carry = halfEnds ? 0 : Math.max(0, d.time - G.clock);
  burn(d.time);
  setBlueBall(d.blueStart);
  if (await checkQuarter()) return;
  toPlaycall();
}

async function puntAway() {
  const net = Math.round(rand(30, 42)), land = G.los + net;
  const touchback = land >= FIELD_LEN;
  burn(6);
  await changePossession(touchback ? 50 : land, touchback ? 'Blue punts into the end zone. Touchback.' : `Blue punts ${net} yards.`);
}

// Clock rules: it runs during the play. After a tackle in bounds it keeps running until the next snap.
// Incompletions, scores and turnovers stop it. Out of bounds stops it only late in each half.
// The 2:00 mark in Q2 and Q4 brings a two-minute warning.
const PLAY_CLOCK_RUNOFF = 30, HURRY_RUNOFF = 18;
function runClock(playSecs, type) {
  const half = G.quarter === 2 || G.quarter === 4;
  const before = G.clock;
  G.clock = Math.max(0, G.clock - playSecs);
  const late = half ? G.clock <= 120 : false;
  let runoff = 0;
  if (type === 'tackle' || type === 'sack') runoff = late ? HURRY_RUNOFF : PLAY_CLOCK_RUNOFF;
  else if (type === 'oob') runoff = late || (G.quarter === 4 && G.clock <= 300) ? 0 : 8;
  if (half && !G.twoMin && before > 120 && G.clock <= 120) { G.twoMin = true; runoff = 0; G.note = 'Two-minute warning'; }
  else if (half && !G.twoMin && G.clock > 120 && G.clock - runoff <= 120) { G.twoMin = true; runoff = G.clock - 120; G.note = 'Two-minute warning'; }
  burn(runoff);
}

async function checkQuarter() {
  if (G.clock > 0) return false;
  if (G.quarter >= 4) {
    const b = G.score.blue, r = G.score.red;
    const head = b > r ? 'Blue wins the backyard' : b < r ? 'Red takes it' : 'Called for dinner. Tie game.';
    await showModal(`<div class="eyebrow">Final</div><h2>${head}</h2><div class="final"><span class="b">${b}</span><span class="dash">—</span><span class="r">${r}</span></div>`,
      [{ label: 'Play again', value: 1, primary: true }]);
    resetGame(); toPlaycall('Kickoff');
    return true;
  }
  if (G.quarter === 2) {
    await showModal(`<div class="eyebrow">Halftime</div><h2>Blue ${G.score.blue}, Red ${G.score.red}</h2><p>Juice boxes on the porch. Blue gets the ball to open the second half.</p>`,
      [{ label: 'Start the 2nd half', value: 1, primary: true }]);
    G.quarter = 3; G.clock = QUARTER_LEN; G.twoMin = false; G.pat = null; setBlueBall(10); updateHUD();
    toPlaycall('2nd half');
    return true;
  }
  G.quarter++; G.clock = QUARTER_LEN - (G.carry || 0); G.carry = 0; G.twoMin = false; G.note = `End of Q${G.quarter - 1}`; updateHUD();
  return false;
}

// Red's possessions are simulated for now. This is the hook for the game's narrative layer later.
function spotName(z) { z = Math.round(z); return z === 30 ? 'Midfield' : z < 30 ? `Blue ${z}` : `Red ${FIELD_LEN - z}`; }
function simulateRedDrive(dist) {
  dist = clamp(Math.round(dist), 1, 59);
  const pTD = clamp(0.8 - (dist / 60) * 0.45, 0.3, 0.8);
  const scores = Math.random() < pTD;
  const total = scores ? dist : Math.round(rand(0, Math.max(0, dist - 4)) * 0.55);
  const who = () => pick(['#11', '#84', '#3', '#22', '#7']);
  const log = []; let z = dist, gained = 0, plays = 0;
  // secs: game time each play uses, including the run between snaps when the clock keeps going
  while (gained < total && plays < 10) {
    plays++;
    if (Math.random() < 0.22) { log.push({ at: spotName(z), text: `Incomplete, intended for ${who()}`, secs: 6 }); continue; }
    const left = total - gained;
    let g = Math.min(left, Math.round(rand(3, 16)));
    if (plays === 10 || (scores && left <= 18 && Math.random() < 0.5)) g = left;
    const k = Math.random();
    const text = k < 0.6 ? `Red QB hits ${who()} for ${g}` : k < 0.85 ? `${who()} takes the pitch for ${g}` : `Red QB scrambles for ${g}`;
    const lastPlay = gained + g >= total && scores;
    log.push({ at: spotName(z), text, secs: lastPlay ? 6 : Math.round(rand(28, 38)) }); z -= g; gained += g;
  }
  let points = 0, headline, summary, blueStart;
  if (scores) {
    const two = Math.random() < 0.2, good = Math.random() < (two ? 0.45 : 0.9);
    points = 6 + (good ? (two ? 2 : 1) : 0);
    log.push({ at: 'End zone', text: `Touchdown Red. ${two ? '2-point try' : 'Extra point'} ${good ? 'good' : 'no good'}.`, tone: 'td', secs: 0 });
    headline = 'Red scores'; summary = `${dist} yards in ${log.length - 1} plays.`; blueStart = 10;
  } else {
    // Most stalled drives end in a punt or on downs; real giveaways are rare
    const k = Math.random();
    const canPunt = z >= 22;
    if (canPunt && k < 0.7) {
      const net = Math.round(rand(28, 40)), land = z - net;
      blueStart = land <= 0 ? 10 : clamp(land, 3, 50);
      log.push({ at: spotName(z), text: `Red punts ${land <= 0 ? 'into the end zone. Touchback' : `${net} yards`}.`, tone: 'stop', secs: 8 });
      headline = 'Red punts'; summary = `Red gained ${gained} yards before stalling.`;
    } else {
      const fail = k < 0.86
        ?{ t: 'Blue bats down the 4th-down throw. Turnover on downs.', h: 'Defense holds', ret: 0 }
        : k < 0.95 ? { t: 'Picked off by Blue!', h: 'Interception', ret: rand(0, 10) }
        : { t: 'Fumble! Blue jumps on it.', h: 'Fumble recovered', ret: 0 };
      log.push({ at: spotName(z), text: fail.t, tone: 'stop', secs: 6 });
      headline = fail.h; summary = `Red gained ${gained} yards before Blue got the ball back.`;
      blueStart = clamp(Math.round(z + fail.ret), 3, 50);
    }
  }
  return { log, points, headline, summary, blueStart, time: log.reduce((s, l) => s + l.secs, 0) };
}
function redDriveHTML(d, lead = '') {
  const items = d.log.map((l, i) => `<li class="${l.tone || ''}" style="--i:${i}"><span class="at">${l.at}</span><span>${l.text}</span></li>`).join('');
  return `<div class="eyebrow red">Red possession</div><h2>${d.headline}</h2>${lead ? `<p>${lead}</p>` : ''}<ol class="drive">${items}</ol><p>${d.summary} Blue ${G.score.blue}, Red ${G.score.red}.</p>`;
}

// ---------- phases & UI
function toPlaycall(note = '') {
  note = [note, G.note].filter(Boolean).join(' · '); G.note = '';
  G.phase = 'playcall';
  lineUp(currentDef); clearRoutes();
  hideAllBars(); renderCards();
  $('playcall').hidden = false;
  $('pcSitu').textContent = situText();
  setHint('');
  updateHUD();
  if (note) banner(note, '', 'gold', 1500);
}
function selectPlay(def) {
  hideAllBars();
  G.phase = 'presnap';
  lineUp(def);
  $('snapbar').hidden = false;
  setHint(isTouch ? '' : 'Press <kbd>Space</kbd> to hike');
}
function hideAllBars() { ['playcall', 'drawbar', 'snapbar'].forEach((id) => { $(id).hidden = true; }); hideRunUI(); }
function showRunUI() {
  $('juke').hidden = false;
  setHint(isTouch ? 'Hold left or right of the runner to steer · tap JUKE' : '<kbd>WASD</kbd> / arrows to steer · <kbd>Space</kbd> to juke');
}
function hideRunUI() { $('juke').hidden = true; touchSteer.id = null; }

function situText() {
  if (G.redBall) return 'Red ball · Blue on defense';
  if (G.pat) return `${G.pat.pts}-pt try · ${spotLabel(G.los)}`;
  const goal = G.fdLine >= FIELD_LEN;
  const togo = G.fdLine - G.los;
  return `${ord(G.down)} & ${goal ? 'Goal' : togo < 0.6 ? 'Inches' : Math.round(togo)} · ${spotLabel(G.los)}`;
}
function spotLabel(z) { z = Math.round(z); return z === 30 ? 'Midfield' : z < 30 ? `Own ${z}` : `Opp ${FIELD_LEN - z}`; }
function fmtClock(s) { s = Math.max(0, Math.ceil(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
function updateHUD() {
  $('sBlue').textContent = G.score.blue; $('sRed').textContent = G.score.red;
  $('qtr').textContent = `Q${G.quarter}`;
  const running = P && !G.pat && !P.resolving && (G.phase === 'live' || G.phase === 'dead');
  $('clk').textContent = fmtClock(G.clock - (running ? P.t : 0));
  const [a, b] = situText().split(' · ');
  $('downs').innerHTML = `<b>${a}</b> · ${b}`;
}

let bannerTimer = 0;
function banner(big, small = '', tone = '', ms = 1800) {
  const el = $('banner'); el.querySelector('.big').textContent = big; el.querySelector('.small').textContent = small;
  el.className = `on ${tone}`; clearTimeout(bannerTimer); bannerTimer = setTimeout(() => { el.className = ''; }, ms);
}
let noteTimer = 0;
function flashNote(t) { const el = $('count'); el.textContent = t; el.className = ''; clearTimeout(noteTimer); noteTimer = setTimeout(() => { if (el.textContent === t) el.textContent = ''; }, 1100); }
function setCount(t, rush = false) { const el = $('count'); el.textContent = t; el.className = rush ? 'rush' : ''; }
function setHint(html) { $('hint').innerHTML = html; }
let toastTimer = 0;
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 1600); }

function showModal(html, buttons) {
  return new Promise((resolve) => {
    G.phase = 'modal'; hideAllBars(); setHint('');
    const card = $('mcard');
    card.innerHTML = `${html}<div class="actions">${buttons.map((b, i) => `<button class="btn ${b.primary ? 'primary' : ''}" data-i="${i}">${b.label}</button>`).join('')}</div>`;
    $('modal').hidden = false;
    card.querySelectorAll('button[data-i]').forEach((btn) => { btn.onclick = () => { $('modal').hidden = true; resolve(buttons[+btn.dataset.i].value); }; });
    card.querySelector('.primary')?.focus();
  });
}

// ---------- playbook cards
function drawDiagram(cv, def) {
  const dpr = Math.min(devicePixelRatio, 2), w = 180, h = 120;
  cv.width = w * dpr; cv.height = h * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const sx = (x) => (x + 16) / 32 * w, sy = (y) => h - (y + 6) / 30 * h;
  for (let i = 0; i < 6; i++) { g.fillStyle = i % 2 ? '#34762b' : '#2f6e27'; g.fillRect(0, i * h / 6, w, h / 6); }
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.setLineDash([4, 4]); g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(0, sy(0)); g.lineTo(w, sy(0)); g.stroke(); g.setLineDash([]);
  g.fillStyle = '#f4f1e6'; g.beginPath(); g.arc(sx(0), sy(-4), 4.5, 0, Math.PI * 2); g.fill();
  def.recv.forEach((r, i) => {
    const pts = [r.start, ...r.path]; const col = ROUTE_COLORS[i];
    g.strokeStyle = col; g.lineWidth = 2.6; g.lineJoin = 'round'; g.lineCap = 'round';
    g.beginPath(); pts.forEach((p, j) => (j ? g.lineTo(sx(p[0]), sy(p[1])) : g.moveTo(sx(p[0]), sy(p[1]))));
    const a = pts[pts.length - 2] || pts[0], b = pts[pts.length - 1];
    let dx = sx(b[0]) - sx(a[0]), dy = sy(b[1]) - sy(a[1]); const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
    if (r.end !== 'settle' && pts.length > 1) {
      const ex = sx(b[0]) + dx * 10, ey = sy(b[1]) + dy * 10; g.lineTo(ex, ey); g.stroke();
      g.fillStyle = col; g.beginPath(); g.moveTo(ex + dx * 7, ey + dy * 7); g.lineTo(ex - dy * 5, ey + dx * 5); g.lineTo(ex + dy * 5, ey - dx * 5); g.fill();
    } else {
      g.stroke();
      if (pts.length > 1) { g.beginPath(); g.moveTo(sx(b[0]) - dy * 6, sy(b[1]) + dx * 6); g.lineTo(sx(b[0]) + dy * 6, sy(b[1]) - dx * 6); g.stroke(); }
    }
    g.fillStyle = col; g.strokeStyle = '#0a1016'; g.lineWidth = 1.5;
    g.beginPath(); g.arc(sx(r.start[0]), sy(r.start[1]), 5, 0, Math.PI * 2); g.fill(); g.stroke();
  });
}
function renderCards() {
  const wrap = $('cards'); wrap.innerHTML = '';
  const dw = document.createElement('div'); dw.className = 'card-wrap';
  dw.innerHTML = `<button class="card draw"><div class="sketch"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#ffcf3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l3.8-1 11-11-2.8-2.8-11 11L3 21z"/><path d="M14 6.2l2.8 2.8"/></svg></div><b>Draw a play</b><span>Your routes</span></button>`;
  dw.firstChild.onclick = enterDraw; wrap.appendChild(dw);
  if (G.down === 4 && !G.pat) {
    const pw = document.createElement('div'); pw.className = 'card-wrap';
    pw.innerHTML = `<button class="card draw"><div class="sketch"><svg width="48" height="44" viewBox="0 0 26 24" fill="none" stroke="#ffcf3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20C6 6 18 2 23 14"/><path d="M19 13l4 1 1-4"/></svg></div><b>Punt</b><span>Kick it away</span></button>`;
    pw.firstChild.onclick = puntAway; wrap.appendChild(pw);
  }
  [...PLAYBOOK, ...customPlays].forEach((def, idx) => {
    const cw = document.createElement('div'); cw.className = 'card-wrap';
    const b = document.createElement('button'); b.className = 'card';
    const cv = document.createElement('canvas'); drawDiagram(cv, def);
    const name = document.createElement('b'); name.textContent = def.name;
    const tag = document.createElement('span'); tag.textContent = def.tag || 'Custom';
    b.append(cv, name, tag); b.onclick = () => selectPlay(def); cw.appendChild(b);
    if (idx >= PLAYBOOK.length) {
      const del = document.createElement('button'); del.className = 'card-del'; del.textContent = '×'; del.setAttribute('aria-label', `Delete ${def.name}`);
      del.onclick = () => { customPlays.splice(idx - PLAYBOOK.length, 1); saveCustom(); renderCards(); toast(`Deleted ${def.name}`); };
      cw.appendChild(del);
    }
    wrap.appendChild(cw);
  });
}

// ---------- route drawing
const draw = { formation: 'spread', paths: [[], [], []], active: -1 };
function drawDef(fillEmpty = false) {
  const st = FORMATIONS[draw.formation].starts;
  return { name: 'Custom', tag: 'Custom', recv: st.map((s, i) => ({ start: s, path: draw.paths[i].length || !fillEmpty ? draw.paths[i].map((p) => p.slice()) : [[s[0], s[1] + 5]], end: 'settle' })) };
}
function enterDraw() {
  hideAllBars(); G.phase = 'draw';
  $('drawbar').hidden = false; renderChips();
  refreshDraw(); snapCamera();
}
function refreshDraw() {
  lineUp(drawDef());
  defense.forEach((d) => { d.mesh.group.visible = false; });
  showRoutes(drawDef(), G.los, 0.5);
}
function renderChips() {
  const wrap = $('formChips'); wrap.innerHTML = '';
  Object.entries(FORMATIONS).forEach(([key, f]) => {
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = f.label; b.setAttribute('aria-pressed', String(key === draw.formation));
    b.onclick = () => {
      const old = FORMATIONS[draw.formation].starts, nu = f.starts;
      draw.paths = draw.paths.map((p, i) => p.map(([x, y]) => [clamp(x + nu[i][0] - old[i][0], -15.5, 15.5), y + nu[i][1] - old[i][1]]));
      draw.formation = key; renderChips(); refreshDraw();
    };
    wrap.appendChild(b);
  });
}
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2(), groundPlane = new THREE.Plane(V(0, 1, 0), 0);
function pointerToPlay(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const p = V(); if (!raycaster.ray.intersectPlane(groundPlane, p)) return null;
  return [-p.x, p.z - G.los];
}
function drawStart(e) {
  const p = pointerToPlay(e); if (!p) return;
  const st = FORMATIONS[draw.formation].starts;
  let best = -1, bd = 3.2; st.forEach((s, i) => { const k = Math.hypot(s[0] - p[0], s[1] - p[1]); if (k < bd) { bd = k; best = i; } });
  if (best < 0) return;
  draw.active = best; draw.paths[best] = []; refreshDraw();
}
function drawMove(e) {
  if (draw.active < 0) return;
  const p = pointerToPlay(e); if (!p) return;
  const x = clamp(p[0], -15.5, 15.5), y = clamp(p[1], -6, FIELD_LEN + EZ - 0.5 - G.los);
  const path = draw.paths[draw.active], last = path[path.length - 1] || FORMATIONS[draw.formation].starts[draw.active];
  if (Math.hypot(x - last[0], y - last[1]) > 1 && path.length < 90) { path.push([+x.toFixed(2), +y.toFixed(2)]); showRoutes(drawDef(), G.los, 0.5); }
}
function drawEnd() {
  if (draw.active < 0) return;
  if (draw.paths[draw.active].length < 2) draw.paths[draw.active] = [];
  draw.active = -1; refreshDraw();
}
$('dBack').onclick = () => toPlaycall();
$('dClear').onclick = () => { draw.paths = [[], [], []]; refreshDraw(); };
$('dRun').onclick = () => { if (draw.paths.every((p) => !p.length)) { toast('Draw at least one route first'); return; } selectPlay(drawDef(true)); };
$('dSave').onclick = () => {
  if (draw.paths.every((p) => !p.length)) { toast('Draw at least one route first'); return; }
  let n = 1; while (customPlays.some((c) => c.name === `My Play ${n}`)) n++;
  const def = drawDef(true); def.name = `My Play ${n}`;
  customPlays.push(def); saveCustom(); toast(`Saved as ${def.name}`);
};
$('btnHike').onclick = (e) => { e.currentTarget.blur(); hike(); };
$('btnChange').onclick = () => toPlaycall();
$('juke').onclick = (e) => { e.currentTarget.blur(); juke(); };

// ---------- pointer & keys
canvas.addEventListener('pointerdown', (e) => {
  if (G.phase === 'draw') { canvas.setPointerCapture(e.pointerId); drawStart(e); return; }
  if (G.phase === 'dead') { P.deadT = Math.min(P.deadT, 0.05); return; }
  if (G.phase !== 'live') return;
  if (P.ball === 'qb' && !aim.on && e.button === 0) {
    canvas.setPointerCapture(e.pointerId);
    Object.assign(aim, { on: true, id: e.pointerId, sx: e.clientX, sy: e.clientY, target: null });
  } else if (P.ball === 'carried' && e.pointerType !== 'mouse') {
    touchSteer.id = e.pointerId; touchSteer.x = (e.clientX - innerWidth / 2) / (innerWidth / 2);
  } else if (e.button === 2 && aim.on) cancelAim();
});
canvas.addEventListener('pointermove', (e) => {
  if (G.phase === 'draw') { drawMove(e); return; }
  if (aim.on && e.pointerId === aim.id && P.ball === 'qb') {
    const dx = e.clientX - aim.sx, dy = e.clientY - aim.sy;
    if (Math.hypot(dx, dy) > 6) { aim.target = aimTarget(dx, dy); drawAim(); }
  }
  if (e.pointerId === touchSteer.id) touchSteer.x = (e.clientX - innerWidth / 2) / (innerWidth / 2);
});
const endPointer = (e) => {
  if (G.phase === 'draw') { drawEnd(); return; }
  if (aim.on && e.pointerId === aim.id) {
    const t = aim.target; cancelAim();
    if (t && G.phase === 'live' && P.ball === 'qb' && hyp(qb.pos, t) >= 2.5) throwBall(t);
  }
  if (e.pointerId === touchSteer.id) touchSteer.id = null;
};
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', (e) => { if (aim.on) cancelAim(); if (G.phase === 'draw') drawEnd(); if (e.pointerId === touchSteer.id) touchSteer.id = null; });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (G.phase === 'modal' || G.phase === 'loading') return;
  if (k.startsWith('arrow') || k === ' ') e.preventDefault();
  keys.add(k);
  if (k === ' ' && !e.repeat) {
    if (G.phase === 'presnap') hike();
    else if (G.phase === 'live' && P.ball === 'carried') juke();
    else if (G.phase === 'dead') P.deadT = Math.min(P.deadT, 0.05);
  }
  if (k === 'escape' && aim.on) cancelAim();
});
addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());

// ---------- animation
function animateEntity(e, dt, time) {
  const m = e.mesh, sp = Math.hypot(e.vel.x, e.vel.z);
  if (e.faceTo != null) e.facing = angLerp(e.facing, e.faceTo, 1 - Math.exp(-dt * 14));
  else if (sp > 0.4) e.facing = angLerp(e.facing, Math.atan2(e.vel.x, e.vel.z), 1 - Math.exp(-dt * 10));
  if (sp > 0.3) e.phase += dt * (3 + sp * 1.5);
  const amp = Math.min(1, sp / 5), sw = Math.sin(e.phase) * 0.95 * amp;
  m.legL.rotation.x = sw; m.legR.rotation.x = -sw; m.armL.rotation.x = -sw * 0.8; m.armR.rotation.x = sw * 0.8;
  if (e.armOverride != null) m.armR.rotation.x = e.armOverride;
  e.fall = e.falling ? Math.min(1, e.fall + dt * 4) : Math.max(0, e.fall - dt * 3);
  m.group.position.set(e.pos.x, Math.abs(Math.sin(e.phase)) * 0.07 * amp, e.pos.z);
  m.group.rotation.set(e.fall * 1.35, e.facing, e.stun > 0 ? Math.sin(time * 25) * 0.14 : 0);
}

const camPos = V(0, 16, -10), camLook = V(0, 0, 18);
function camTargets() {
  const a = camera.aspect;
  if (G.phase === 'draw') {
    const cz = G.los + 9, D = Math.max(36,18.5 / (Math.tan(THREE.MathUtils.degToRad(25)) * a));
    return [V(0, D, cz - D * 0.22), V(0, 0, cz)];
  }
  let fx = 0, fz = G.los + 2;
  if (P && (G.phase === 'live' || G.phase === 'dead')) {
    if (P.flight && P.flight.thrown) { fx = ball.position.x * 0.6 + P.flight.e.x * 0.4; fz = Math.max(G.los + 2, ball.position.z * 0.5 + P.flight.e.z * 0.5 - 3); }
    else if (P.holder && (P.holder !== qb || P.ball === 'carried')) { fx = P.holder.pos.x; fz = P.holder.pos.z + 1; }
    else if (!P.holder) { fx = ball.position.x * 0.7; fz = Math.max(G.los + 2, ball.position.z - 3); }
    else { fx = qb.pos.x * 0.5; fz = G.los + 2; }
  }
  const k = a < 1 ? 1 + (1 - a) * 1.6 : 1;
  return [V(fx * 0.4, 17 * k, fz - 19 * k), V(fx * 0.6, 0, fz + 7)];
}
function snapCamera() { const [p, l] = camTargets(); camPos.copy(p); camLook.copy(l); }
function updateCamera(dt) {
  const [p, l] = camTargets();
  const k = G.phase === 'draw' ? 1 : 1 - Math.exp(-dt * 3.2);
  camPos.lerp(p, k); camLook.lerp(l, k);
  camera.position.copy(camPos); camera.lookAt(camLook);
  sun.position.set(camLook.x - 22, 44, camLook.z - 12); sun.target.position.copy(camLook);
}

function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);

let last = performance.now(), time = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  if (G.phase === 'live') { updateLive(dt); updateHUD(); }
  else if (G.phase === 'dead') updateDead(dt);
  if (P && P.throwAnim > 0) { P.throwAnim -= dt; qb.armOverride = P.throwAnim > 0 ? 2.6 - (1 - P.throwAnim / 0.28) * 3.8 : null; }
  everyone.forEach((e) => animateEntity(e, dt, time));
  placeHeldBall();
  const ctrl = G.phase === 'live' ? (P.ball === 'qb' ? qb : P.ball === 'carried' ? P.carrier : null) : null;
  ctrlRing.visible = !!ctrl;
  if (ctrl) { ctrlRing.position.set(ctrl.pos.x, 0.05, ctrl.pos.z); ctrlRing.scale.setScalar(1 + Math.sin(time * 6) * 0.06); }
  updateCamera(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// ---------- boot
async function boot() {
  await Promise.race([document.fonts.load('48px Bungee'), new Promise((r) => setTimeout(r, 1500))]).catch(() => {});
  buildWorld(); resize();
  setBlueBall(10); lineUp(PLAYBOOK[0]); clearRoutes(); updateHUD(); snapCamera();
  $('loading').hidden = true;
  requestAnimationFrame(frame);
  await showModal(`<div class="eyebrow">Blue vs Red · 4 on 4</div><h1>Backyard Blitz</h1>
    <p>Sandlot rules: four downs to make ten yards, no field goals, and one rusher who counts three Mississippi before coming after you. Stuck on 4th down? Go for it or punt it away.</p>
    <dl class="controls">
      <dt>Call it</dt><dd>Pick a play from the book or draw your own routes.</dd>
      <dt>Hike</dt><dd><kbd>Space</kbd> or the HIKE button.</dd>
      <dt>Throw</dt><dd>Press anywhere and pull back like a slingshot. Pull farther to throw deeper, then let go. Lead your receiver.</dd>
      <dt>QB</dt><dd><kbd>WASD</kbd> or arrows move in the pocket. Cross the line and you are a runner.</dd>
      <dt>Run</dt><dd>Steer with <kbd>WASD</kbd> or arrows (on touch, hold left or right of the runner). <kbd>Space</kbd> or JUKE to shake a tackler.</dd>
    </dl>`, [{ label: 'Play ball', value: 1, primary: true }]);
  toPlaycall('Kickoff');
}
boot();
</script>

</body>
